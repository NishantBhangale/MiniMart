services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=minimart
      - POSTGRES_PASSWORD=minimart
      - POSTGRES_DB=minimart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimart -d minimart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - minimart-net
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minimart-net
  backend:
    build: ./backend
    container_name: minimart-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minimart-net
  frontend: 
    build: ./frontend
    container_name: minimart-frontend
    ports:
      - "8081:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - minimart-net
volumes:
  pgdata:
  redis-data:
networks:
  minimart-net:
    name: minimart-net
    driver: bridge